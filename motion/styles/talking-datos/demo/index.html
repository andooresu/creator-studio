<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion reel</title>
<style>
  /* Estilo "Talking con datos": UNA familia, Montserrat ExtraBold 800 (la misma de los subtítulos del preset box-marca).
     init.sh ya la deja en assets/fonts/captions/. Para la fuente de tu marca, cambia esta @font-face y --display. */
  @font-face { font-family: 'Montserrat'; src: url(../assets/fonts/captions/Montserrat-ExtraBold.ttf); font-weight: 800; }
  :root {
    /* tokens del estilo: fondo pizarra sereno, paneles un tono más claro, texto blanco, UN acento (el de la marca).
       --accent pinta la caja de los subtítulos, la cifra clave, la barra destacada, el paso activo y el CTA.
       --on-accent (texto sobre el acento) lo calcula datos.js por contraste: #111 o #fff. --accent-text (el acento usado
       como texto sobre el panel: cifra, palabras de acento) también: el mismo tono, aclarado si no lee. --accent-fill (barra
       destacada, su valor y paso activo) es el acento aclarado si se pierde sobre --line; --bar-plain y --val-plain (barra
       normal y su cifra) bajan si resaltarían más que la destacada; --on-white (texto de la píldora del CTA) es #111 o #fff según --white. */
    --bg: #12161D; --bg-2: #1A202A; --surface: #1E2530; --panel: #1B222C; --line: #2C3542;
    --white: #F4F6F8; --muted: #9AA4B2; --ink: #111111; --accent: #4CC9F0; --on-accent: #111111; --accent-text: #4CC9F0;
    --accent-fill: #4CC9F0; --on-accent-fill: #111111; --bar-plain: #9AA4B2; --val-plain: #F4F6F8; --on-white: #111111;
    --display: 'Montserrat', 'Arial Black', Arial, sans-serif;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: var(--display); font-weight: 800; color: var(--white);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* título de gancho: mayúsculas con sombra suave; la palabra clave va en la caja de acento.
     Va siempre sobre la tarjeta de video con velo negro, así que es blanco fijo (no --white, que una marca clara oscurece). */
  .display { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
             text-transform: uppercase; color: #FFFFFF; text-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .boxw { background: var(--accent); color: var(--on-accent); border-radius: 0.14em; padding: 0 0.12em; text-shadow: none; }
  /* cabecera de sección junto a la tarjeta pequeña: frase normal, blanco */
  .head { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; color: var(--white); }
  .line { position: absolute; overflow: hidden; padding: 0.12em 0.08em 0.2em; margin: -0.12em -0.08em 0; white-space: nowrap; }
  .word { display: inline-block; }
  /* etiqueta "DATO N": píldora de acento */
  .chip { position: absolute; white-space: nowrap; line-height: 1; transform-origin: 0 50%;
          padding: 0.42em 0.8em 0.46em; border-radius: 999px; background: var(--accent); color: var(--on-accent);
          letter-spacing: 0.06em; text-transform: uppercase; }
  /* panel de datos: esquina 36 px, sombra profunda suave, filo fino; nunca glow */
  .panel { position: absolute; overflow: hidden; border-radius: 36px; background: var(--panel); transform-origin: 50% 50%;
           box-shadow: inset 0 0 0 2px rgba(255,255,255,.06), 0 40px 90px -30px rgba(0,0,0,.7); }
  .label { white-space: nowrap; line-height: 1; font-size: 38px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .fig { white-space: nowrap; line-height: 1; letter-spacing: -0.03em; color: var(--accent-text); font-variant-numeric: tabular-nums; }
  .fig .suf { font-size: 0.5em; margin-left: 0.08em; letter-spacing: 0; }
  .note { white-space: nowrap; line-height: 1; font-size: 36px; color: var(--muted); }
  .val { white-space: nowrap; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .num { display: flex; align-items: center; justify-content: center; border-radius: 50%; line-height: 1; transform-origin: 50% 50%; }
  .step { display: flex; align-items: center; white-space: nowrap; line-height: 1; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; padding: 0.45em 0.8em; border-radius: 999px;
         background: rgba(0,0,0,.5); color: rgba(255,255,255,.9); letter-spacing: 0.05em; text-transform: uppercase; transform-origin: 50% 50%; }
  .cta { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; padding: 0.5em 0.95em 0.55em; border-radius: 999px;
         background: var(--white); color: var(--on-white); transform-origin: 50% 50%; box-shadow: 0 16px 50px -12px rgba(0,0,0,.6); }
  .cta b { color: var(--on-accent); background: var(--accent); border-radius: 0.4em; padding: 0.05em 0.25em; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script>
  // VO DE EJEMPLO (solo para la demo): frases y palabras con tiempos en segundos sobre la rejilla de 100 BPM.
  // Con tu voz real (scripts/vo.py + scripts/words.py → sync.mjs) window.VO ya viene lleno y esto no se usa.
  // * marca una palabra clave (va en la caja de acento y algo más grande).
  if (!window.VO || !window.VO.length) {
    const P = (id, t0, t1, text, ws) => ({ id, t0, t1, text, words: ws.map(([w, a, b]) => ({ w, t0: a, t1: b })) });
    window.VO = [
      P('p1', 0.05, 2.1, 'Esto es lo que dicen los datos.', [['Esto', 0.05, 0.3], ['es', 0.3, 0.42], ['lo', 0.42, 0.55], ['que', 0.55, 0.7], ['dicen', 0.7, 1.05], ['los', 1.05, 1.25], ['datos.', 1.25, 2.1]]),
      P('p2', 2.6, 4.9, 'Primero, la *cifra* clave de tu tema.', [['Primero,', 2.6, 3.05], ['la', 3.1, 3.2], ['cifra', 3.2, 3.6], ['clave', 3.6, 4.0], ['de', 4.0, 4.1], ['tu', 4.1, 4.25], ['tema.', 4.25, 4.9]]),
      P('p3', 5.5, 8.0, 'Luego, compara la opción A con la B.', [['Luego,', 5.5, 5.9], ['compara', 5.95, 6.4], ['la', 6.4, 6.5], ['opción', 6.5, 6.85], ['A', 6.85, 7.1], ['con', 7.15, 7.3], ['la', 7.3, 7.4], ['B.', 7.4, 8.0]]),
      P('p4', 8.5, 10.9, 'Y al final, tres *pasos* para aplicarlo.', [['Y', 8.5, 8.6], ['al', 8.6, 8.75], ['final,', 8.75, 9.2], ['tres', 9.3, 9.55], ['pasos', 9.55, 9.95], ['para', 9.95, 10.15], ['aplicarlo.', 10.15, 10.9]]),
      P('p5', 11.5, 13.7, 'Guárdalo y *síguenos* para más.', [['Guárdalo', 11.5, 12.0], ['y', 12.0, 12.1], ['síguenos', 12.15, 12.7], ['para', 12.75, 12.95], ['más.', 12.95, 13.7]]),
    ];
  }
</script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="lib/media.js"></script>
<script src="lib/captions.js"></script>
<script src="datos.js"></script>
<script src="lib/inserts.js"></script>
<script src="film.js"></script>
</body>
</html>
