<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion reel</title>
<style>
  /* Estilo "Talking karaoke": UNA familia, Montserrat ExtraBold 800 (la misma de los subtítulos karaoke-amarillo).
     init.sh ya la deja en assets/fonts/captions/. Para la fuente de tu marca, cambia esta @font-face y --display. */
  @font-face { font-family: 'Montserrat'; src: url(../assets/fonts/captions/Montserrat-ExtraBold.ttf); font-weight: 800; }
  :root {
    /* tokens del estilo: la imagen de la persona manda; texto blanco, acento amarillo, contorno negro */
    --ink: #111111; --white: #FFFFFF; --accent: #FFD43B; --shade: rgba(0,0,0,.58);
    --room-1: #1B222D; --room-2: #2C3746; --lamp: #F2B66B;
    --display: 'Montserrat', 'Arial Black', Arial, sans-serif;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--room-1); transform-origin: 0 0;
           font-family: var(--display); font-weight: 800; color: var(--white);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* título de gancho: mayúsculas, contorno negro como los subtítulos, sombra suave */
  .display { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1; white-space: nowrap;
             text-transform: uppercase; -webkit-text-stroke: 0.07em #000; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .line { position: absolute; overflow: hidden; padding: 0.12em 0.08em 0.2em; margin: -0.12em -0.08em 0; white-space: nowrap; }
  .word { display: inline-block; }
  /* etiqueta "TRUCO N": píldora amarilla, texto negro */
  .chip { position: absolute; left: 0; top: 0; transform-origin: 0 50%; white-space: nowrap; line-height: 1;
          padding: 0.42em 0.8em 0.46em; border-radius: 999px; background: var(--accent); color: var(--ink);
          letter-spacing: 0.02em; text-transform: uppercase; box-shadow: 0 10px 30px -8px rgba(0,0,0,.5); }
  /* tarjeta de b-roll: esquina 28 px, sombra profunda, nunca glow */
  .broll { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 28px; transform-origin: 50% 50%;
           box-shadow: 0 2px 6px rgba(0,0,0,.25), 0 40px 90px -24px rgba(0,0,0,.7); }
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5em;
        color: rgba(255,255,255,.92); text-transform: uppercase; letter-spacing: 0.03em; text-align: center; }
  .ph .play { width: 1.9em; height: 1.9em; border-radius: 50%; background: rgba(0,0,0,.35); position: relative; }
  .ph .play::after { content: ''; position: absolute; left: 0.75em; top: 0.55em; border-style: solid; border-width: 0.4em 0 0.4em 0.62em;
                     border-color: transparent transparent transparent #fff; }
  .ph small { font-size: 0.62em; opacity: .8; letter-spacing: 0.06em; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; padding: 0.45em 0.8em; border-radius: 999px;
         background: var(--shade); color: rgba(255,255,255,.9); letter-spacing: 0.05em; text-transform: uppercase; transform-origin: 50% 50%; }
  .cta { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; padding: 0.5em 0.95em 0.55em; border-radius: 999px;
         background: var(--white); color: var(--ink); transform-origin: 50% 50%; box-shadow: 0 16px 50px -12px rgba(0,0,0,.6); }
  .cta b { color: var(--ink); background: var(--accent); border-radius: 0.4em; padding: 0.05em 0.25em; }
  .bar { position: absolute; left: 0; top: 0; height: 8px; background: var(--accent); }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script>
  // VO DE EJEMPLO (solo para la demo): frases y palabras con tiempos en segundos sobre la rejilla de 100 BPM.
  // Con tu voz real (scripts/vo.py + scripts/words.py → sync.mjs) window.VO ya viene lleno y esto no se usa.
  // * marca una palabra clave (va en acento y algo más grande).
  if (!window.VO || !window.VO.length) {
    const P = (id, t0, t1, text, ws) => ({ id, t0, t1, text, words: ws.map(([w, a, b]) => ({ w, t0: a, t1: b })) });
    window.VO = [
      P('p1', 0.05, 2.2, 'Tres trucos para grabar mejor con tu celular.', [['Tres', 0.05, 0.4], ['trucos', 0.45, 0.9], ['para', 0.95, 1.1], ['grabar', 1.1, 1.45], ['mejor', 1.45, 1.75], ['con', 1.75, 1.85], ['tu', 1.85, 1.92], ['celular.', 1.92, 2.2]]),
      P('p2', 2.45, 4.8, 'Uno: busca la *luz* de una ventana.', [['Uno:', 2.45, 2.85], ['busca', 3.0, 3.3], ['la', 3.3, 3.4], ['luz', 3.45, 3.85], ['de', 3.9, 4.0], ['una', 4.0, 4.2], ['ventana.', 4.2, 4.8]]),
      P('p3', 5.45, 7.6, 'Dos: graba a la altura de tus *ojos*.', [['Dos:', 5.45, 5.85], ['graba', 6.0, 6.35], ['a', 6.35, 6.42], ['la', 6.42, 6.5], ['altura', 6.5, 6.85], ['de', 6.85, 6.92], ['tus', 6.92, 7.05], ['ojos.', 7.05, 7.6]]),
      P('p4', 7.85, 10.1, 'Tres: háblale a la cámara como a un *amigo*.', [['Tres:', 7.85, 8.25], ['háblale', 8.4, 8.8], ['a', 8.8, 8.86], ['la', 8.86, 8.95], ['cámara', 8.95, 9.35], ['como', 9.35, 9.52], ['a', 9.52, 9.58], ['un', 9.58, 9.66], ['amigo.', 9.66, 10.1]]),
      P('p5', 10.25, 12.2, 'Guárdalo. *Síguenos* para más.', [['Guárdalo.', 10.25, 10.75], ['Síguenos', 10.9, 11.45], ['para', 11.5, 11.7], ['más.', 11.7, 12.2]]),
    ];
  }
</script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="lib/media.js"></script>
<script src="lib/captions.js"></script>
<script src="talking.js"></script>
<script src="film.js"></script>
</body>
</html>
