<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion reel</title>
<style>
  /* Estilo "Punto cinético": UNA sola familia (Inter variable) para display y UI.
     Copia fonts/ del estilo a assets/fonts/ (o pon aquí la fuente de tu marca y cambia la familia). */
  @font-face { font-family: 'Inter'; src: url(../assets/fonts/Inter-Variable.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Inter'; src: url(../assets/fonts/Inter-Variable-LatinExt.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root {
    /* tokens del estilo: UN acento como rampa tonal (--accent sobre claro, --accent-2 sobre noche/acento, --accent-soft para rellenos) */
    --bg: #FCFBF8; --bg-2: #EFEDE8; --ink: #17151A; --ink-2: #57525C;
    --accent: #D61F69; --accent-2: #FF9CC2; --accent-soft: #FBE3EC; --night: #1A1220; --card: #FFFEFC;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: -0.045em;
             line-height: 0.95; white-space: nowrap; }
  /* una línea es una máscara: las palabras suben por ella. 0.24em arriba deja sitio a tildes y signos ¿ ¡ */
  .line { position: absolute; overflow: hidden; padding: 0.24em 0.04em 0.18em; margin: -0.24em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .dot { display: inline-block; color: var(--accent); transform-origin: 50% 85%; }
  .card { position: absolute; background: var(--card); border-radius: 28px;
          box-shadow: 0 2px 6px rgba(0,0,0,.05), 0 30px 80px -20px rgba(0,0,0,.22); }
  /* tarjeta de UI: sombra de contacto profunda, radio 20–30 px. Sin glow, sin degradados. */
  .shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--card);
          box-shadow: 0 2px 6px rgba(23,21,26,.06), 0 40px 90px -30px rgba(23,21,26,.38); }
  .shot img, .shot canvas { display: block; position: absolute; left: 0; top: 0; }
  .ui-pill { position: absolute; left: 0; top: 0; transform-origin: 0 50%; white-space: nowrap; font-weight: 700;
             letter-spacing: -0.01em; line-height: 1; padding: 0.62em 1.1em; border-radius: 999px; }
  .wm { display: block; }
  .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 56px; transform-origin: 6px 4px; z-index: 30; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="lib/media.js"></script>
<script src="lib/captions.js"></script>
<script src="punto.js"></script>
<script src="film.js"></script>
</body>
</html>
